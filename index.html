<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소라고동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#2c6a63}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:var(--font);color:#1c2f2c;overflow-x:hidden;
 background:linear-gradient(180deg,#0f3a41 0%,#245e5e 45%,#5f9683 78%,#86a889 100%);background-attachment:fixed}
.layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.sand{position:fixed;left:0;right:0;bottom:0;height:calc(26dvh + env(safe-area-inset-bottom,0px));pointer-events:none;
 background:
  radial-gradient(circle,rgba(70,55,30,.5) 0 1px,transparent 1.6px) 0 0/23px 19px,
  radial-gradient(circle,rgba(70,55,30,.4) 0 1.2px,transparent 1.8px) 9px 7px/31px 27px,
  radial-gradient(circle,rgba(255,255,230,.35) 0 1px,transparent 1.6px) 4px 13px/37px 29px,
  linear-gradient(180deg,#a9ad7c,#b8ad7b 40%,#8f8a5b);
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26px);mask-image:linear-gradient(180deg,transparent 0,#000 26px)}
.blade{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--d) ease-in-out var(--s) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--a) * -1))}to{transform:rotate(var(--a))}}

main{--w:max(230px,min(84vw,380px,calc((100dvh - 270px) * .94)));position:relative;z-index:3;min-height:100dvh;
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px calc(9dvh + 8px)}
.ask{position:relative;z-index:2;width:var(--w);margin-bottom:calc(var(--w) * -.05)}
.ask.nudge{animation:nudge .4s ease}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
textarea{display:block;width:100%;margin:0;padding:12px 14px;border:0;border-radius:0;outline:0;resize:none;
 font:500 1.05rem/1.5 var(--font);color:#1c2f2c;background:rgba(255,255,255,.86)}
textarea:focus{background:#fff}
textarea::placeholder{color:#5c6f6b;opacity:1}
.stage{position:relative;z-index:3;width:var(--w);aspect-ratio:369/393;pointer-events:none}
.shell{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.shell.buzz{animation:buzz .09s linear infinite alternate}
@keyframes buzz{from{transform:translate(-.9px,.5px) rotate(-.25deg)}to{transform:translate(.9px,-.5px) rotate(.25deg)}}
#fx{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#ring{pointer-events:auto;cursor:grab;touch-action:none;outline:none}
#ring.grab{cursor:grabbing}
.res{width:var(--w);min-height:96px;display:flex;justify-content:center;margin-top:10px}
.ans{position:relative;align-self:flex-start;margin-top:12px;padding:10px 26px 12px;max-width:100%;text-align:center;
 font:900 clamp(1.7rem,7.2vw,2.5rem)/1.3 var(--font);color:#1c2f2c;background:#fffaf0;border-radius:24px;
 box-shadow:0 8px 20px rgba(0,0,0,.22);overflow-wrap:anywhere;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.ans::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-10px;border:0 solid transparent;border-width:0 10px 12px;border-bottom-color:#fffaf0}
.ans[hidden]{display:none}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.blade,.shell.buzz,.ask.nudge,.ans{animation:none}}
</style>
</head>

    if(navigator.vibrate&&now-hap>140){hap=now;try{navigator.vibrate(8)}catch(_){}}
  }
  for(var i=parts.length-1;i>=0;i--){
    var b=parts[i];b.age+=dt;b.y-=b.vy*dt;var u=b.age/b.life;
    if(u>=1){bub.removeChild(b.el);parts.splice(i,1);continue}
    b.el.setAttribute('cx',(b.x+Math.sin(b.age*5+b.ph)*4*u).toFixed(1));b.el.setAttribute('cy',b.y.toFixed(1));
